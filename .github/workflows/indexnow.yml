# After every push to main, wait for that commit's Vercel Production deployment, then tell IndexNow
# (Bing, Yandex and others) which pages changed. Page fingerprints are kept in the Actions cache
# between runs, so only new, changed or removed pages are submitted.
# (Runs on push rather than deployment_status because the Actions cache can't save on
# deployment_status events, which aren't tied to a branch.)
# Run it by hand from the Actions tab with "submit all" ticked to resubmit every URL in the sitemap.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Restore page fingerprints
        uses: actions/cache@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Wait for the Vercel Production deployment of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&environment=Production" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state // empty')
              echo "deployment $id: ${state:-pending}"
              case "$state" in
                success) sleep 30; exit 0 ;;   # give the production alias a moment to switch
                inactive) echo "Superseded by a newer deployment; its own run will submit."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0 ;;
                failure|error) echo "Production deployment did not succeed; nothing to submit."; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "Timed out waiting for the Production deployment."; exit 1

      - name: Submit to IndexNow
        if: env.SKIP != '1'
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.all }}" = "true" ]; then
            python3 scripts/indexnow.py --all
          else
            python3 scripts/indexnow.py --changed .indexnow-state.json
          fi
