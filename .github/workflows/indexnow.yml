# After every successful Vercel production deploy, tell IndexNow (Bing, Yandex and others)
# which pages changed. Page fingerprints are kept in the Actions cache between runs, so only
# new, changed or removed pages are submitted. Run it by hand from the Actions tab with
# "submit all" ticked to resubmit every URL in the sitemap.
name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Restore page fingerprints
        uses: actions/cache@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Wait for the production alias to serve the new build
        if: github.event_name == 'deployment_status'
        run: sleep 30

      - name: Submit to IndexNow
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.all }}" = "true" ]; then
            python3 scripts/indexnow.py --all
          else
            python3 scripts/indexnow.py --changed .indexnow-state.json
          fi
